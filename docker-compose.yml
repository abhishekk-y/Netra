services:
  netra-backend:
    labels:
      - "app=netra"
      - "component=backend"
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Netra}
      NETRA_DB_PATH: /app/data/netra.db
      NETRA_SEED_DEMO: ${NETRA_SEED_DEMO:-false}
      NETRA_API_TOKEN: ${NETRA_API_TOKEN:-}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - netra_data:/app/data
      - netra_evidence:/app/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  netra-frontend:
    labels:
      - "app=netra"
      - "component=frontend"
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      netra-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  netra_data:
  netra_evidence:

